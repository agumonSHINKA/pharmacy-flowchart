<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>社區藥局流程圖編輯器</title>
<!-- 字型可選：離線時自動改用電腦內建 Noto Sans CJK TC／PingFang／微軟正黑體 -->
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--paper:#f5f5f5;--ink:#2d3142;--muted:#4f5d75;--soft:#5a6580;--accent:#bf4520;
--sans:'Geist','Noto Sans TC','Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
--serif:'Instrument Serif','Noto Serif TC','Noto Serif CJK TC',serif;--mono:'Geist Mono',ui-monospace,monospace}
html,body{height:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;padding:10px 16px;border-bottom:1px solid rgba(45,49,66,.15);background:#fafafa}
header .brand{font:500 11px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-right:8px}
header .sep{width:1px;height:22px;background:rgba(45,49,66,.18);margin:0 4px}
button,.btn{font:500 13px var(--sans);color:var(--ink);background:#fff;border:1px solid rgba(45,49,66,.55);border-radius:6px;padding:5px 10px;cursor:pointer;white-space:nowrap}
button:hover,.btn:hover{border-color:var(--accent);color:var(--accent)}
button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
button:disabled{opacity:.4;cursor:default;border-color:rgba(45,49,66,.3);color:var(--ink)}
.edit-only{display:none}
body.editing .edit-only{display:inline-flex}
body.editing .view-only{display:none}
#status{font-size:12px;color:var(--soft);margin-left:auto}
main{flex:1;display:flex;min-height:0}
#canvasWrap{flex:1;overflow:auto;position:relative}
#svg{display:block;width:1480px;min-width:1480px;height:auto;margin:12px auto;user-select:none;-webkit-user-select:none}
#panel{width:300px;border-left:1px solid rgba(45,49,66,.15);background:#fafafa;padding:14px;overflow:auto;display:none;font-size:13px}
body.editing #panel{display:block}
#panel h3{font:600 14px var(--sans);margin-bottom:8px}
#panel .help{color:var(--soft);font-size:12px;line-height:1.6}
#panel label{display:block;margin:10px 0 4px;color:var(--muted);font-size:12px;font-weight:500}
#panel input[type=text],#panel textarea,#panel select,#panel input[type=number]{width:100%;font:13px var(--sans);padding:5px 7px;border:1px solid rgba(45,49,66,.35);border-radius:4px;background:#fff;color:var(--ink)}
#panel textarea{min-height:52px;resize:vertical}
#panel .row{display:flex;gap:6px}
#panel .row>*{flex:1}
#panel .chk{display:flex;align-items:center;gap:6px;margin-top:10px;color:var(--ink);font-size:13px}
#panel .actions{margin-top:14px;display:flex;gap:6px;flex-wrap:wrap}
#panel .danger{border-color:#a33;color:#a33}
.zone,.tri{cursor:pointer;outline:none}
.zone .zframe{transition:height .35s ease}
.zone:hover .zhit{fill:rgba(191,69,32,.06)}
.tri:hover polygon{stroke:var(--accent);stroke-width:1.6}
.fade{transition:opacity .3s ease}
.hidden{opacity:0;pointer-events:none}
body.editing .node{cursor:move}
.node.sel>.shape{stroke:#2e5aa8 !important;stroke-width:2.4 !important}
.edge.sel>path.vis{stroke:#2e5aa8 !important;stroke-width:2.2 !important}
.edge .hit{stroke:transparent;stroke-width:12;fill:none}
body.editing .edge .hit{cursor:pointer}
.handle{cursor:crosshair}
body.connecting #svg{cursor:crosshair}
#inline{position:absolute;display:none;z-index:5;background:#fff;border:1px solid #2e5aa8;border-radius:6px;padding:6px;box-shadow:none;gap:4px;flex-direction:column}
#inline input,#inline textarea{font:13px var(--sans);padding:4px 6px;border:1px solid rgba(45,49,66,.35);border-radius:4px;width:100%}
#inline .hint{font-size:11px;color:var(--soft)}
@media (prefers-reduced-motion:reduce){.zone .zframe,.fade{transition:none!important}}
</style>
</head>
<body>
<header>
  <span class="brand">Flowchart Editor · 社區藥局</span>
  <button id="modeBtn">切換到編輯模式 (Edit)</button>
  <span class="sep"></span>
  <button id="expandAll" class="view-only">全部展開 (Expand all)</button>
  <button id="collapseAll" class="view-only">全部收合 (Collapse all)</button>
  <button id="addBtn" class="edit-only">＋ 新增節點 (Add)</button>
  <button id="connectBtn" class="edit-only">連線 (Connect)</button>
  <button id="delBtn" class="edit-only">刪除 (Delete)</button>
  <button id="undoBtn" class="edit-only" title="Ctrl+Z">復原 (Undo)</button>
  <button id="redoBtn" class="edit-only" title="Ctrl+Y">重做 (Redo)</button>
  <span class="sep"></span>
  <button id="exportJsonBtn">匯出 JSON</button>
  <button id="importJsonBtn">匯入 JSON</button>
  <input type="file" id="fileIn" accept=".json,application/json" hidden>
  <button id="htmlBtn">下載 HTML</button>
  <button id="svgBtn">匯出 SVG</button>
  <button id="pngBtn">匯出 PNG</button>
  <button id="resetBtn">還原原始 (Reset)</button>
  <span id="status"></span>
</header>
<main>
  <div id="canvasWrap"><svg id="svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 1292"></svg><div id="inline"></div></div>

</main>

// ---------- coordinates ----------
function svgPt(ev){var p=svg.createSVGPoint(); p.x=ev.clientX; p.y=ev.clientY; var m=$('root').getScreenCTM().inverse(); var r=p.matrixTransform(m); return [r.x,r.y];}
function snap4(v){return Math.round(v/4)*4;}
function nodeAt(x,y,exclude){ for(var i=data.nodes.length-1;i>=0;i--){var n=data.nodes[i]; if(n.id===exclude) continue; if(x>=n.x&&x<=n.x+n.w&&y>=n.y&&y<=n.y+n.h) return n;} return null; }

// ---------- selection & dragging ----------
function select(kind,id){ sel=id?{kind:kind,id:id}:null; render(); }
function nodeDown(ev,n){
  ev.stopPropagation(); if(ev.button!==0) return;
  if(connectFrom){ if(connectFrom!==n.id) addEdge(connectFrom,n.id); connectFrom=null; document.body.classList.remove('connecting'); return; }
  if(isDbl('n:'+n.id)){ ev.preventDefault(); inlineNode(n); return; }
  if(!(sel&&sel.kind==='node'&&sel.id===n.id)){ sel={kind:'node',id:n.id}; }
  var start=svgPt(ev), ox=n.x, oy=n.y, before=snap(), moved=false;
  var gEl=null;
  function mv(e){ var p=svgPt(e); var dx=p[0]-start[0], dy=p[1]-start[1]; if(!moved&&Math.abs(dx)+Math.abs(dy)<3) return; moved=true;
    n.x=snap4(ox+dx); n.y=snap4(oy+dy); render(); }
  function up(){ window.removeEventListener('pointermove',mv); window.removeEventListener('pointerup',up);
    if(moved) commit(before); else render(); }
  window.addEventListener('pointermove',mv); window.addEventListener('pointerup',up);
  render();
}
function autoSides(a,b){
  var dx=(b.x+b.w/2)-(a.x+a.w/2), dy=(b.y+b.h/2)-(a.y+a.h/2);
  if(Math.abs(dy)>=Math.abs(dx)) return dy>=0?['bottom','top']:['top','bottom'];
  return dx>=0?['right','left']:['left','right'];
}
function addEdge(f,t){
  var a=nodeById(f), b=nodeById(t); if(!a||!b||f===t) return;
  var before=snap(), s=autoSides(a,b);
  var id=nextId('e',data.edges);
  data.edges.push({id:id,from:f,fromSide:s[0],to:t,toSide:s[1],label:'',dashed:false,accent:false});
  sel={kind:'edge',id:id}; commit(before); status('已新增連線 (connected) '+a.label+' → '+b.label);
}
function handleDown(ev,n){
  if(ev.button!==0) return;
  var root=$('root'); var start=sidePt(n,'bottom');
  var line=el('path',{d:'',stroke:'#2e5aa8','stroke-width':1.6,'stroke-dasharray':'4,3',fill:'none','marker-end':'url(#arrow-sel)'},root);
  function mv(e){var p=svgPt(e); line.setAttribute('d','M'+start[0]+','+start[1]+' L'+p[0]+','+p[1]);}
  function up(e){window.removeEventListener('pointermove',mv); window.removeEventListener('pointerup',up);
    var p=svgPt(e); var t=nodeAt(p[0],p[1],n.id); if(line.parentNode) line.parentNode.removeChild(line);
    if(t) addEdge(n.id,t.id); else render(); }
  window.addEventListener('pointermove',mv); window.addEventListener('pointerup',up);
}
function nextId(prefix,list){var m=0; list.forEach(function(o){var k=parseInt(String(o.id).replace(/\D/g,''),10); if(k>m)m=k;}); return prefix+(m+1);}
function sectionAt(x,y){ for(var i=0;i<data.sections.length;i++){var f=frameOf(data.sections[i]); if(x>=f.x&&x<=f.x+f.w&&y>=f.y&&y<=f.y+f.h) return data.sections[i].id;} return 'T'; }
function addNode(x,y){
  var before=snap(); var w=200,h=52;
  if(x==null){ var wrap=$('canvasWrap'); var r=svg.getBoundingClientRect(); var ev={clientX:Math.max(r.left,0)+wrap.clientWidth/2,clientY:Math.max(r.top,0)+wrap.clientHeight/2}; var p=svgPt(ev); x=p[0]; y=p[1]; }
  var n={id:nextId('n',data.nodes),type:'process',label:'新步驟',sublabel:'',section:sectionAt(x,y),safety:false,x:snap4(x-w/2),y:snap4(y-h/2),w:w,h:h};
  data.nodes.push(n); sel={kind:'node',id:n.id}; commit(before); status('已新增節點 (node added)');
  return n;
}
function deleteSel(){
  if(!sel) return; var before=snap();
  if(sel.kind==='node'){ var id=sel.id; data.nodes=data.nodes.filter(function(n){return n.id!==id;}); data.edges=data.edges.filter(function(e){return e.from!==id&&e.to!==id;}); }
  else { var eid=sel.id; data.edges=data.edges.filter(function(e){return e.id!==eid;}); }
  sel=null; commit(before); status('已刪除 (deleted)');
}

// ---------- inline edit ----------
function inlineBox(x,y,w,h,fields,onOk){
  var box=$('inline'); var root=$('root'); var m=root.getScreenCTM(); var wr=$('canvasWrap').getBoundingClientRect();
  box.innerHTML='';
  var inputs=fields.map(function(f){var i=document.createElement(f.multi?'textarea':'input'); if(!f.multi)i.type='text'; i.value=f.value; i.placeholder=f.ph; i.setAttribute('aria-label',f.ph); box.appendChild(i); return i;});
  var hint=document.createElement('div'); hint.className='hint'; hint.textContent='Enter 確認・Esc 取消（副標題可換行：Shift+Enter）'; box.appendChild(hint);
  box.style.display='flex';
  box.style.left=(m.a*x+m.e-wr.left+$('canvasWrap').scrollLeft)+'px';
  box.style.top=(m.d*y+m.f-wr.top+$('canvasWrap').scrollTop)+'px';
  box.style.width=Math.max(220,m.a*w)+'px';
  inputs[0].focus(); inputs[0].select();
  function done(ok){ box.style.display='none'; box.onkeydown=null; if(ok) onOk(inputs.map(function(i){return i.value;})); }
  box.onkeydown=function(e){ if(e.key==='Escape'){e.preventDefault();done(false);} else if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();done(true);} e.stopPropagation(); };
  inputs.forEach(function(i){i.addEventListener('blur',function(){setTimeout(function(){ if(box.style.display!=='none'&&!box.contains(document.activeElement)) done(true); },120);});});
}
function inlineNode(n){
  sel={kind:'node',id:n.id}; render();
  inlineBox(n.x,n.y,n.w,n.h,[{value:n.label,ph:'標題 (label)'},{value:n.sublabel||'',ph:'副標題 (sublabel)',multi:true}],function(v){
    var before=snap(); var nn=nodeById(n.id); if(!nn) return; nn.label=v[0].trim()||nn.label; nn.sublabel=v[1].trim(); commit(before); });
}
function inlineEdge(e){
  sel={kind:'edge',id:e.id}; render(); var pts=route(e); var p=pts[0];
  inlineBox(p[0],p[1],160,30,[{value:e.label||'',ph:'連線標籤 (edge label)'}],function(v){var before=snap(); var ee=data.edges.filter(function(x){return x.id===e.id;})[0]; if(ee){ee.label=v[0].trim(); commit(before);} });
}

function bindField(id,setter,onChange){

function exportJSON(){ download('pharmacy-flowchart.json',new Blob([JSON.stringify(data,null,1)],{type:'application/json'})); status('已匯出 JSON'); }
function validate(d){ if(!d||!Array.isArray(d.nodes)||!Array.isArray(d.edges)||!Array.isArray(d.sections)) throw new Error('格式不符：需要 nodes / edges / sections');
  d.nodes.forEach(function(n){ if(!n.id||typeof n.x!=='number'||typeof n.y!=='number') throw new Error('節點資料不完整：'+JSON.stringify(n).slice(0,60)); if(!n.w)n.w=200; if(!n.h)n.h=52; if(!n.type)n.type='process'; if(!n.section)n.section='T'; });
  d.edges.forEach(function(e){ if(!e.from||!e.to) throw new Error('連線資料不完整'); if(!e.fromSide||!e.toSide){e.fromSide='bottom';e.toSide='top';} if(!e.id) e.id='e'+Math.random().toString(36).slice(2,7); });
  if(!d.viewBox) d.viewBox=[1480,1292]; if(d.offsetY==null) d.offsetY=72; if(!d.title) d.title=ORIGINAL.title; if(d.subtitle==null) d.subtitle=ORIGINAL.subtitle; return d; }
function importJSONText(text){ var d=validate(JSON.parse(text)); var before=snap(); data=d; sel=null; commit(before); status('已匯入 JSON (imported)'); }
function importJSON(file){ var r=new FileReader(); r.onload=function(){ try{importJSONText(r.result);}catch(e){alert('匯入失敗：'+e.message);} }; r.readAsText(file,'utf-8'); }
function downloadHTML(){
  var seedEl=$('seed-data'), old=seedEl.textContent;
  seedEl.textContent=JSON.stringify({seedId:'s'+Date.now(),data:data}).replace(/</g,'\\u003c');
  var svgOld=svg.innerHTML; svg.innerHTML=''; var inl=$('inline').innerHTML; $('inline').innerHTML=''; var pan=$('panel').innerHTML; $('panel').innerHTML='';
  var cls=document.body.className; document.body.className='';
  var html='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
  document.body.className=cls; seedEl.textContent=old; svg.innerHTML=svgOld; $('inline').innerHTML=inl; $('panel').innerHTML=pan; render();
  download('pharmacy-flowchart-editor-copy.html',new Blob([html],{type:'text/html'})); status('已下載含目前資料的 HTML');
}
function svgString(){ var wasEd=editing, s=sel; if(wasEd){editing=false;} sel=null; var o=clone(open); for(var k in open) open[k]=true; render();
  var c=svg.cloneNode(true); c.setAttribute('xmlns',NS); c.removeAttribute('style'); var vb=svg.getAttribute('viewBox').split(' '); c.setAttribute('width',vb[2]); c.setAttribute('height',vb[3]);
  var str=new XMLSerializer().serializeToString(c); open=o; editing=wasEd; sel=s; render(); return {str:str,w:+vb[2],h:+vb[3]}; }
function exportSVG(){ var s=svgString(); download('pharmacy-flowchart.svg',new Blob([s.str],{type:'image/svg+xml'})); status('已匯出 SVG（全部展開）'); }
function exportPNG(){ var s=svgString(); var img=new Image(); var url=URL.createObjectURL(new Blob([s.str],{type:'image/svg+xml'}));
  img.onload=function(){ var cv=document.createElement('canvas'); cv.width=s.w*2; cv.height=s.h*2; var ctx=cv.getContext('2d'); ctx.scale(2,2); ctx.drawImage(img,0,0); URL.revokeObjectURL(url);
    cv.toBlob(function(b){download('pharmacy-flowchart.png',b); status('已匯出 PNG（全部展開）');},'image/png'); };
  img.onerror=function(){alert('PNG 匯出失敗，請改用 SVG 匯出');}; img.src=url; }
function resetAll(){ if(!confirm('確定要還原成原始流程圖嗎？目前的修改會被清除（可用 Ctrl+Z 復原）。')) return; var before=snap(); data=clone(ORIGINAL); sel=null; commit(before); status('已還原為原始版本 (reset)'); }

// ---------- wiring ----------
$('modeBtn').onclick=function(){setMode(!editing);};
$('expandAll').onclick=function(){for(var k in open)open[k]=true; render();};
$('collapseAll').onclick=function(){for(var k in open)open[k]=false; render();};
$('addBtn').onclick=function(){addNode();};
$('connectBtn').onclick=startConnect;
$('delBtn').onclick=deleteSel;
$('undoBtn').onclick=undo; $('redoBtn').onclick=redo;
$('exportJsonBtn').onclick=exportJSON;
$('importJsonBtn').onclick=function(){$('fileIn').click();};
$('fileIn').onchange=function(){ if(this.files[0]) importJSON(this.files[0]); this.value=''; };
$('htmlBtn').onclick=downloadHTML; $('svgBtn').onclick=exportSVG; $('pngBtn').onclick=exportPNG; $('resetBtn').onclick=resetAll;
svg.addEventListener('pointerdown',function(ev){ if(!editing||ev.button!==0) return;
  if(isDbl('bg')){ ev.preventDefault(); var p=svgPt(ev); var n=addNode(p[0],p[1]); setTimeout(function(){inlineNode(nodeById(n.id));},0); return; }
  if(connectFrom){connectFrom=null;document.body.classList.remove('connecting');status('已取消連線');} if(sel){sel=null; render();} });
document.addEventListener('keydown',function(ev){
  var tag=(ev.target.tagName||'').toLowerCase(); var typing=tag==='input'||tag==='textarea'||tag==='select';
  if((ev.ctrlKey||ev.metaKey)&&!typing){ var k=ev.key.toLowerCase(); if(k==='z'&&!ev.shiftKey){ev.preventDefault();undo();} else if(k==='y'||(k==='z'&&ev.shiftKey)){ev.preventDefault();redo();} }
  if(!editing||typing) return;
  if(ev.key==='Delete'||ev.key==='Backspace'){ if(sel){ev.preventDefault(); deleteSel();} }
  if(ev.key==='Escape'){ connectFrom=null; document.body.classList.remove('connecting'); sel=null; render(); }
});
window.__editor={get data(){return data;}, open:open, setMode:setMode, importJSONText:importJSONText, render:render};
load(); setMode(false); updButtons();
})();
</script>
</body>
